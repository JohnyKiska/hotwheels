name: Backend tests

on:
  push:
    branches: [main, integration/catalog-foundation]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hw_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hw_catalog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify clean PostgreSQL migration and repeat upgrade
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hw_catalog_test
        run: |
          alembic upgrade head
          alembic upgrade head
