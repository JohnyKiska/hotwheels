name: Backend tests

on:
  push:
    branches: [main, integration/catalog-foundation]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hw_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hw_catalog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify clean SQLite migration and repeat upgrade
        env:
          DATABASE_URL: sqlite:///./auth-migration-test.db
        run: |
          alembic upgrade head
          alembic upgrade head

      - name: Verify clean PostgreSQL migration and repeat upgrade
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hw_catalog_test
        run: |
          alembic upgrade head
          alembic upgrade head

      - name: Verify PostgreSQL append-only enforcement
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hw_catalog_test
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              with engine.begin() as connection:
                  connection.execute(text("""
                      INSERT INTO change_log
                          (id, entity_type, entity_id, action, reason, actor_type, created_at)
                      VALUES
                          ('pg-audit-test', 'release', 'pg-release-test', 'created',
                           'Original event', 'ci', CURRENT_TIMESTAMP)
                  """))

              for statement in (
                  "UPDATE change_log SET reason = 'rewritten' WHERE id = 'pg-audit-test'",
                  "DELETE FROM change_log WHERE id = 'pg-audit-test'",
              ):
                  try:
                      with engine.begin() as connection:
                          connection.execute(text(statement))
                  except Exception as exc:
                      assert "append-only" in str(exc), str(exc)
                  else:
                      raise AssertionError("PostgreSQL allowed a change_log mutation")

              with engine.connect() as connection:
                  reason = connection.execute(
                      text("SELECT reason FROM change_log WHERE id = 'pg-audit-test'")
                  ).scalar_one()
                  assert reason == "Original event"
          finally:
              engine.dispose()
          PY
