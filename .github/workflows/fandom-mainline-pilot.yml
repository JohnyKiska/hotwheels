name: Fandom Mainline pilot

on:
  push:
    branches:
      - feature/scheduled-market-data
    paths:
      - '.github/workflows/fandom-mainline-pilot.yml'
      - 'scripts/import_fandom_mainline.py'
      - 'scripts/compare_fandom_allhw.py'
  workflow_dispatch:
    inputs:
      year:
        description: Mainline year to import
        required: true
        default: '2025'
        type: string

permissions:
  contents: read

jobs:
  import-and-compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import Fandom Mainline snapshot
        shell: bash
        env:
          YEAR: ${{ inputs.year || '2025' }}
        run: |
          set +e
          python scripts/import_fandom_mainline.py --year "$YEAR" --output "fandom-mainline-${YEAR}.json" 2>&1 | tee fandom-import.log
          import_status=${PIPESTATUS[0]}
          exit "$import_status"
      - name: Compare with saved AllHW pages
        env:
          YEAR: ${{ inputs.year || '2025' }}
        run: python scripts/compare_fandom_allhw.py --fandom "fandom-mainline-${YEAR}.json" --html-dir ALLHW --output "fandom-allhw-comparison-${YEAR}.json"
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fandom-mainline-${{ inputs.year || '2025' }}-review
          path: |
            fandom-mainline-${{ inputs.year || '2025' }}.json
            fandom-allhw-comparison-${{ inputs.year || '2025' }}.json
            fandom-import.log
          if-no-files-found: warn
          retention-days: 14
