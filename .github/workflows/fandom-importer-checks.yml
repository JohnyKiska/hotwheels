name: Fandom importer checks

on:
  push:
    branches:
      - feature/scheduled-market-data
    paths:
      - 'scripts/import_fandom_mainline.py'
      - 'scripts/compare_fandom_allhw.py'
      - 'scripts/enrich_catalog_from_html.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/fandom-importer-checks.yml'
  pull_request:
    paths:
      - 'scripts/import_fandom_mainline.py'
      - 'scripts/compare_fandom_allhw.py'
      - 'scripts/enrich_catalog_from_html.py'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
