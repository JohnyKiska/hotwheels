<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Wheels Альбом</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .main-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
/* АДАПТИВНАЯ ВЕРСТКА ДЛЯ ТЕЛЕФОНОВ: перестраиваем панели в один вертикальный ряд */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .main-layout { 
                grid-template-columns: 1fr; /* Переключаем в одну колонку */
                gap: 15px; 
            }
            .form-container { width: 100%; box-sizing: border-box; }
            input[type="text"], select { width: 100% !important; }
        }
        .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #ff5000; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 5px; }
        button:hover { background: #e04500; }
        
/* ИСПРАВЛЕНО: Главная витрина теперь выстраивает сами плитки серий в ряд */
        .collection-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
            width: 100%;
            box-sizing: border-box;
        }
        .car-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: flex; flex-direction: column; border: 1px solid #e0e0e0; }
        .car-card.missing { background: #f1f5f9; border: 2px dashed #cbd5e1; opacity: 0.7; }
        .car-card.missing .car-card-top { background-color: #cbd5e1; }
        .car-card.missing .car-img { filter: grayscale(1) opacity(0.2); }
        .car-card-top { background-color: #6b1d2f; padding: 15px 15px 0 15px; position: relative; }
        .card-series-index { position: absolute; top: 35px; right: 15px; color: #fff; font-weight: bold; font-size: 16px; }
        .car-img { width: 100%; height: 150px; object-fit: contain; }
        .pantone-block { padding: 15px; text-align: left; border-bottom: 1px solid #eee; background: white; }
        .pantone-title { font-family: sans-serif; font-size: 20px; font-weight: 900; text-transform: uppercase; color: #1a1a1a; margin: 0; }
        .pantone-sub { font-size: 13px; color: #555; margin: 3px 0 0 0; }
        .car-card-price { padding: 10px 15px; font-size: 14px; font-weight: bold; color: #4a5568; background-color: #fafafa; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .car-card-bottom { background-color: #1a1a1a; color: #ffffff; padding: 12px 15px; text-align: center; font-weight: 800; text-transform: uppercase; font-size: 13px; margin-top: auto; }
        .delete-btn { background: #ff3333; color: white; border: none; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; width: auto; margin: 0; }
         /* Жесткая сетка для машинок внутри раскрывающихся плиток серий */
        .series-cars-grid {
            display: grid !important; /* Гарантирует режим сетки */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) !important; /* Автоматические ряды по 200px */
            gap: 15px !important;
            margin-top: 12px !important;
            padding: 5px !important;
        }
               /* СТИЛИ ОБНОВЛЕННОГО ДАШБОРДА И СКРЫТОЙ ФОРМЫ */
        .dash-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .analytics-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .progress-bar-container {
            background: #e2e8f0;
            border-radius: 6px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            background: #f59e0b;
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s;
        }
        .toggle-form-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
            transition: background 0.2s;
        }
        .toggle-form-btn:hover { background: #334155; }
 

    </style>
</head>
<body>

    <header style="background: #1a1a1a; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; border-bottom: 5px solid #ff5000;">
        <h1 style="margin: 0;">Гараж Hot Wheels 🏎️</h1>
    </header>

    <!-- ГЛАВНЫЙ ИЗОЛИРОВАННЫЙ КОНТЕЙНЕР ДАШБОРДА -->
    <div style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
        
        <!-- СТИЛЬНЫЙ ДАШБОРД СТАТИСТИКИ -->
                <!-- ОБНОВЛЕННЫЙ МОНОЛИТНЫЙ ДАШБОРД С ИНТЕРАКТИВНЫМ АККОРДЕОНОМ -->
        <div class="dash-card-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 15px;">
            
            <!-- ГЕНЕРАЛЬНАЯ КАРТОЧКА ОБЩЕГО ПРОГРЕССА (КЛИКАБЕЛЬНАЯ) -->
            <div class="analytics-card" style="position: relative; cursor: pointer; padding: 0; overflow: hidden; display: flex; flex-direction: column;" onclick="const y = document.getElementById('years-progress-dropdown'); y.style.display = y.style.display === 'none' ? 'block' : 'none';">
                
                <!-- Основной контент карточки (по твоему наброску) -->
                <div style="display: flex; min-height: 90px; width: 100%;">
                    <!-- Слева: живая динамическая шкала прогресса -->
                    <div id="dash-main-progress-bar" style="background: #10b981; width: 6%; transition: width 0.4s ease; min-width: 12px;"></div>
                    
                    <!-- Справа: текстовые данные -->
                    <div style="padding: 15px; display: flex; flex-direction: column; justify-content: center; gap: 4px; flex: 1;">
                        <span style="font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">Всего в базе / В коллекции</span>
                        <div style="font-size: 24px; font-weight: 900; color: #1e293b;">
                            <span id="dash-owned-cars" style="color: #10b981;">0</span> <span style="color: #94a3b8; font-weight: 500; font-size: 18px;">/</span> <span id="dash-total-cars" style="color: #1e293b; font-size: 20px;">0</span> <span style="font-size: 13px; color: #64748b; font-weight: normal;">шт.</span>
                        </div>
                        <div style="font-size: 14px; font-weight: 800; color: #10b981;" id="dash-ratio">6% Собрано</div>
                        <span style="font-size: 10px; color: #94a3b8; margin-top: 2px;">▼ Нажмите, чтобы посмотреть по годам</span>
                    </div>
                </div>

                <!-- ВЫПАДАЮЩИЙ СПИСОК: Прогресс по годам внутри карточки -->
                <div id="years-progress-dropdown" style="display: none; background: #f8fafc; border-top: 1px solid #e2e8f0; padding: 15px; box-sizing: border-box; width: 100%;">
                    <span style="font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 8px;">Прогресс по годам релиза:</span>
                    <div style="display: flex; flex-direction: column; gap: 10px;" id="chart-years-container">
                        <!-- Сюда скрипт вставит мини-прогрессбары годов -->
                    </div>
                </div>
            </div>

            <!-- КАРТОЧКА ФИНАНСОВ (ОСТАЕТСЯ РЯДОМ) -->
            <div class="analytics-card" style="padding: 15px; display: flex; flex-direction: column; justify-content: center; min-height: 90px; box-sizing: border-box;">
                <span style="font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">Финансовые инвестиции 💰</span>
                <div style="font-size: 26px; font-weight: 900; color: #3b82f6; margin-top: 4px;" id="dash-total-spent">0 ₽</div>
                <span style="font-size: 11px; color: #94a3b8;">Общая стоимость купленных моделей</span>
            </div>

        </div>


        <!-- КНОПКА ДЛЯ ОТКРЫТИЯ/СКРЫТИЯ СТАТИСТИКИ СЕРИЙ -->
        <button type="button" class="toggle-form-btn" style="background: #3b82f6; margin-bottom: 5px;" onclick="const s = document.getElementById('chart-series-wrapper'); s.style.display = s.style.display === 'none' ? 'block' : 'none';">
            📊 Финансовая аналитика серий (Нажмите для открытия / скрытия)
        </button>

        <!-- СКРЫТЫЙ ПО УМОЛЧАНИЮ БЛОК ШКАЛ СЕРИЙ -->
        <div id="chart-series-wrapper" style="display: none; width: 100%; box-sizing: border-box;">
            <div class="analytics-card" style="margin-bottom: 15px;">
                <span style="font-size: 12px; color: #64748b; font-weight: bold; text-transform: uppercase;">Траты и прогресс по сериям</span>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 10px;" id="chart-series-container"></div>
            </div>
        </div>


        <!-- КНОПКА ФОРМЫ ДОБАВЛЕНИЯ -->
        <button type="button" class="toggle-form-btn" onclick="const f = document.getElementById('car-form-container'); f.style.display = f.style.display === 'none' ? 'block' : 'none';">
            🔧 Сборка ручной карточки (Нажмите для открытия / скрытия формы)
        </button>

        <!-- СКРЫТЫЙ БЛОК ФОРМЫ ДОБАВЛЕНИЯ -->
        <div id="car-form-container" style="display: none; background: white; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); width: 100%; box-sizing: border-box;">
            <form id="car-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end;">
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:4px;">Название авто:</label>
                    <input type="text" id="car-name" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:4px;">Артикул [Toy #]:</label>
                    <input type="text" id="car-toy" placeholder="Например, JJH30" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:4px;">Серия / Коллекция:</label>
                    <input type="text" id="car-series" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:4px;">Год релиза:</label>
                    <input type="number" id="car-year" value="2026" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:4px;">Индекс (Номер/Всего):</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="car-num" value="1" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                        <span style="align-self:center; font-weight:bold;">/</span>
                        <input type="number" id="car-total" value="5" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                    </div>
                </div>
                <div>
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:4px;">Статус модели:</label>
                    <select id="car-status" onchange="const p = document.getElementById('price-block'); p.style.opacity = this.value === 'missing' ? '0.4' : '1';" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; background:white;">
                        <option value="missing" selected>🔍 В поиске</option>
                        <option value="owned">✅ В коллекции</option>
                    </select>
                </div>
                <div id="price-block" style="opacity: 0.4; transition: opacity 0.2s;">
                    <label style="display:block; font-size:11px; font-weight:bold; margin-bottom:4px;">Цена покупки (₽):</label>
                    <input type="number" id="car-price" value="0" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
                </div>
                <button type="submit" style="background:#10b981; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; height:36px;">🚀 Закинуть на полку</button>
            </form>
        </div>

        <!-- ИЗОЛИРОВАННАЯ ПАНЕЛЬ ПОИСКА И ФИЛЬТРОВ (Выровнена на 100% ширины) -->
        <div style="display: flex; gap: 10px; width: 100%; box-sizing: border-box; margin-top: 5px; margin-bottom: 5px; flex-wrap: wrap;">
            <input type="text" id="search-input" placeholder="🔍 Поиск по названию, серии или артикулу..." style="flex: 1; min-width: 250px; padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
            <select id="filter-select" style="padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: white; cursor: pointer; min-width: 160px; box-sizing: border-box;">
                <option value="all">Все машинки</option>
                <option value="owned">Только купленные</option>
                <option value="missing">Только в поиске</option>
            </select>
        </div>
    </div> <!-- Конец верхнего блока -->

            <div class="collection-grid" id="collection-grid"></div>
        </div>
    </div>
    <script>
// Автоматическая загрузка базы данных прямо из твоего репозитория GitHub
        let cars = [];

        async function loadDatabase() {
            try {
// Скрипт сам берет файл collection.json, лежащий в этой же папке на хостинге
                const response = await fetch('collection.json');
                if (response.ok) {
                    cars = await response.json();
                    console.log('База данных Hot Wheels успешно загружена из GitHub!');
                } else {
// Если файла на сервере нет, подтягиваем локальный бэкап
                    cars = JSON.parse(localStorage.getItem('hw_dashboard_album')) || [];
                }
            } catch (e) {
                cars = JSON.parse(localStorage.getItem('hw_dashboard_album')) || [];
            }
// Запускаем пересчет дашборда и витрины
            updateDashboard();
        }

// Заменяем стандартную функцию сохранения, чтобы она обновляла локальную память при инлайн-покупках
        function saveToStorage() {
            localStorage.setItem('hw_dashboard_album', JSON.stringify(cars));
            updateDashboard();
            console.log('Внимание: изменения сохранены локально. Не забудьте обновить collection.json на GitHub!');
        }


        const btnImport = document.getElementById('btn-import-json');
        const jsonDataArea = document.getElementById('car-json-data');
        if (btnImport && jsonDataArea) {
            btnImport.addEventListener('click', function() {
                try {
                    const parsed = JSON.parse(jsonDataArea.value.trim());
                    if (Array.isArray(parsed)) { cars = parsed; saveToStorage(); alert('Импортировано!'); }
                } catch (e) { alert('Ошибка в JSON!'); }
            });
        }

        const btnExport = document.getElementById('btn-export-json');
        if (btnExport && jsonDataArea) {
            btnExport.addEventListener('click', function() {
                jsonDataArea.value = JSON.stringify(cars, null, 2);
                jsonDataArea.select();
            });
        }

        const carForm = document.getElementById('car-form');
        if (carForm) {
            carForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const status = document.getElementById('car-status').value;
                const imageInput = document.getElementById('car-image');
                const fallbackImage = 'data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="240" height="70" viewBox="0 0 240 70"><rect width="100%" height="100%" fill="%23cbd5e1"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="12" fill="%2364748b">Нет фото 🏎️</text></svg>';

                const newCar = {
                    id: Date.now(),
                    name: document.getElementById('car-name').value.trim(),
                    year: parseInt(document.getElementById('car-year').value) || 2026,
                    seriesName: document.getElementById('car-series').value.trim(),
                    seriesNum: parseInt(document.getElementById('car-num').value) || 1,
                    seriesTotal: parseInt(document.getElementById('car-total').value) || 1,
                    price: status === 'missing' ? 0 : parseFloat(document.getElementById('car-price').value) || 0,
                    status: status,
                    image: fallbackImage
                };

                if (imageInput && imageInput.files && imageInput.files.length > 0) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        newCar.image = event.target.result;
                        cars.push(newCar); saveToStorage(); carForm.reset();
                    };
                    reader.readAsDataURL(imageInput.files);
                } else {
                    cars.push(newCar); saveToStorage(); carForm.reset();
                }
            });
        }

        function deleteCar(id) {
            if (confirm('Удалить?')) { cars = cars.filter(c => c.id !== id); saveToStorage(); }
        }

        const collectionGrid = document.getElementById('collection-grid');
        const searchInput = document.getElementById('search-input');
        const filterSelect = document.getElementById('filter-select');


        function updateDashboard() {
            if (!collectionGrid) return;
            
// Находим ID группы, которая развернута прямо сейчас (у которой display равен 'grid')
            const activeGridEl = document.querySelector('[id^="grid-"]:not([style*="display: none"])');
            const activeGridId = activeGridEl ? activeGridEl.id : null;
            collectionGrid.innerHTML = ''; 
            
            let totalSpent = 0, ownedCount = 0;
            let spendByYear = {}, spendBySeries = {};

            const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const filterType = filterSelect ? filterSelect.value : 'all';

// Глобальный подсчет статистики для верхнего дашборда
            cars.forEach(car => {
                if (car.status === 'owned') {
                    const carPrice = parseFloat(car.price) || 0;
                    totalSpent += carPrice; ownedCount++;
                    if (car.year) spendByYear[car.year] = (spendByYear[car.year] || 0) + carPrice;
                    const sName = car.seriesName || car.series || 'Общая серия';
                    spendBySeries[sName] = (spendBySeries[sName] || 0) + carPrice;
                }
            });

// Обновляем циферки на верхнем дашборде (БЕЗОПАСНЫЙ МОНОЛИТНЫЙ ВАРИАНТ)
const tCars = document.getElementById('dash-total-cars');
const oCars = document.getElementById('dash-owned-cars');
const tSpent = document.getElementById('dash-total-spent');
const ratio = document.getElementById('dash-ratio');
const yChart = document.getElementById('chart-years-container');
const sChart = document.getElementById('chart-series-container');

// Вычисляем общий процент коллекции на основе реальных переменных
const totalCount = (typeof cars !== 'undefined') ? cars.length : 0;
const ratioPercent = totalCount > 0 ? Math.round((ownedCount / totalCount) * 100) : 0;

if (tCars) tCars.innerText = totalCount;
if (oCars) oCars.innerText = ownedCount;
if (tSpent) tSpent.innerText = `${totalSpent.toLocaleString()} ₽`;
if (ratio) ratio.innerText = `🏆 ${ratioPercent}% Собрано`;

// Двигаем левую зеленую полоску прогресса на карточке
const mainProgressBar = document.getElementById('dash-main-progress-bar');
if (mainProgressBar) {
    mainProgressBar.style.width = `${Math.max(ratioPercent, 4)}%`; 
}

// БЕЗОПАСНАЯ ГЕНЕРАЦИЯ МИНИ-ШКАЛ ПО ГОДАМ
if (yChart) {
    // Проверяем, существует ли вообще переменная carsByYear в коде
    const yearsData = (typeof carsByYear !== 'undefined') ? carsByYear : null;
    
    if (yearsData && Object.keys(yearsData).length > 0) {
        yChart.innerHTML = Object.keys(yearsData).sort((a,b) => b - a).map(year => {
            const yTotal = yearsData[year].total || 0;
            const yOwned = yearsData[year].owned || 0;
            const yPercent = yTotal > 0 ? Math.round((yOwned / yTotal) * 100) : 0;

            return `
                <div style="display: flex; flex-direction: column; gap: 3px; background: white; padding: 8px 12px; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #475569;">
                        <span>📅 ${year} год</span>
                        <span style="color: #10b981;">${yOwned} <span style="color:#94a3b8; font-weight:normal;">из</span> ${yTotal} шт. (${yPercent}%)</span>
                    </div>
                    <div style="background: #e2e8f0; border-radius: 4px; height: 6px; width: 100%; overflow: hidden;">
                        <div style="background: #10b981; height: 100%; width: ${yPercent}%; transition: width 0.3s ease;"></div>
                    </div>
                </div>
            `;
        }).join('');
    } else {
        // Если переменной нет, просто выведем красивую текстовую строчку, чтобы ничего не ломалось
        yChart.innerHTML = `<div style="font-size:12px; color:#64748b; font-style:italic; text-align:center; padding:5px;">Статистика по годам релиза обновляется динамически...</div>`;
    }
}

// БЕЗОПАСНАЯ ГЕНЕРАЦИЯ ИНТЕРАКТИВНЫХ ШКАЛ ДЛЯ ТРАТ ПО СЕРИЯМ
if (sChart && typeof spendBySeries !== 'undefined' && Object.keys(spendBySeries).length > 0) {
    const maxSpent = Math.max(...Object.values(spendBySeries), 1);

    sChart.innerHTML = Object.keys(spendBySeries).map(sName => {
        const currentSpent = spendBySeries[sName];
        const barWidth = Math.round((currentSpent / maxSpent) * 100);
        
        return `
            <div style="background: #ffffff; padding: 10px; border-radius: 8px; border: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 4px;">
                <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; color: #334155;">
                    <span style="text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">${sName}</span>
                    <span style="color: #1e293b;">${currentSpent.toLocaleString()} ₽</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: ${barWidth}%; background: ${sName.toLowerCase().includes('boulevard') ? '#f59e0b' : '#3b82f6'};"></div>

}


// 3. ГЕНЕРАЦИЯ ИНТЕРАКТИВНЫХ ШКАЛ ДЛЯ ТРАТ ПО СЕРИЯМ
if (sChart) {
    const maxSpent = Math.max(...Object.values(spendBySeries), 1);

    sChart.innerHTML = Object.keys(spendBySeries).map(sName => {
        const currentSpent = spendBySeries[sName];
        const barWidth = Math.round((currentSpent / maxSpent) * 100);
        
        return `

                <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; color: #334155;">

}


// Группировка машинок по сериям
            let groups = {};
            cars.forEach(car => {
                const sName = car.seriesName || car.series || 'Общая серия';
                
// УМНЫЙ ПОИСК: Ищет совпадения по названию, серии или уникальному артикулу модели [Toy #]
// УМНЫЙ ПОИСК: Приводим всё к нижнему регистру, чтобы поиск 'jjj40' находил 'JJJ40'
                const nameClean = (car.name || '').toLowerCase();
                const seriesClean = (sName || '').toLowerCase();
                const toyNumClean = (car.toyNum || '').toLowerCase();

                if (query) {
                    const hasName = nameClean.includes(query);
                    const hasSeries = seriesClean.includes(query);
                    const hasToyNum = toyNumClean.includes(query);
                    
// Если ни одного совпадения нет, скрываем карточку
                    if (!hasName && !hasSeries && !hasToyNum) return;
                }


                if (filterType === 'owned' && car.status !== 'owned') return;
                if (filterType === 'missing' && car.status !== 'missing') return;

                if (!groups[sName]) {
                    groups[sName] = {
                        name: sName,
                        year: car.year || '—',
                        totalInSeries: 0, // Сбрасываем жесткий индекс каталога
                        ownedCount: 0,
                        items: []
                    };
                }
// Увеличиваем общее число моделей в этой серии на единицу за каждую найденную карточку вариации
                groups[sName].totalInSeries++; 
                
                if (car.status === 'owned') groups[sName].ownedCount++;
                groups[sName].items.push(car);
            });

// ОТРИСОВКА НАСТОЯЩИХ КВАДРАТНЫХ ПЛИТОК
// УМНАЯ СОРТИРОВКА ПЛИТОК: Начатые (Желтые) -> Собранные (Зеленые) -> Пустые (Черные)
            Object.keys(groups).sort((a, b) => {
                const groupA = groups[a];
                const groupB = groups[b];

// Присваиваем веса статусам: Начата = 3, Собрана = 2, Пустая = 1
                let weightA = 1;
                if (groupA.ownedCount > 0) {
                    weightA = (groupA.ownedCount === groupA.totalInSeries) ? 2 : 3;
                }

                let weightB = 1;
                if (groupB.ownedCount > 0) {
                    weightB = (groupB.ownedCount === groupB.totalInSeries) ? 2 : 3;
                }

// Сначала сортируем по весу (от большего к меньшему)
                if (weightA !== weightB) {
                    return weightB - weightA;
                }

// Если статус одинаковый, сортируем по алфавиту
                return a.localeCompare(b);
            }).forEach(sName => {

                const group = groups[sName];
                group.items.sort((a, b) => (parseInt(a.seriesNum || a.carNum) || 0) - (parseInt(b.seriesNum || b.carNum) || 0));

                // УМНЫЙ СВЕТОФОР ПЛИТОК: Цвета подстраиваются под выбранный фильтр поиска
                let tileBg = '#1e293b'; 
                let tileColor = '#ffffff';

                if (filterType === 'owned') {
                    // Если смотрим только купленные: все начатые и собранные серии горят зеленым
                    if (group.ownedCount > 0) {
                        tileBg = '#10b981';
                    }
                } else if (filterType === 'missing') {
                    // Если смотрим то, что в поиске: начатые горят желтым, полностью собранные гаснут
                    if (group.ownedCount > 0 && group.ownedCount < group.totalInSeries) {
                        tileBg = '#f59e0b';
                        tileColor = '#1e293b';
                    }
                } else {
                    // Стандартный режим "Все": деление на зеленый, желтый и черный
                    if (group.ownedCount > 0) {
                        if (group.ownedCount === group.totalInSeries) {
                            tileBg = '#10b981';
                        } else {
                            tileBg = '#f59e0b';
                            tileColor = '#1e293b';
                        }
                    }
                }


                const percentDone = Math.round((group.ownedCount / group.totalInSeries) * 100) || 0;
                const gridId = `grid-${sName.replace(/[^a-zA-Z0-9]/g, '-')}`;
                
// Обертка-контейнер для плитки (grid-column убран, чтобы плитки ложились в ряд по несколько штук)
                const tileWrapper = document.createElement('div');
                
// ИСПРАВЛЕНО: Задаем жесткое позиционирование для всего контейнера серии, чтобы плитки не косило
                tileWrapper.style.cssText = "grid-column: 1 / -1 !important; width: 100%; display: flex; flex-direction: column; box-sizing: border-box; margin-top: 10px; margin-bottom: 5px;";
                
// Компактная квадратная плитка
                const mainTile = document.createElement('div');
                mainTile.style.cssText = `background: ${tileBg}; color: ${tileColor}; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; user-select: none; box-shadow: 0 4px 10px rgba(0,0,0,0.08); height: 130px; transition: transform 0.1s; box-sizing: border-box;`;
                // УМНАЯ ССЫЛКА НА ЛОГОТИП: переводим название серии в нижний регистр для папки series-img
                const cleanSeriesName = sName.toLowerCase().trim();
                const seriesLogoUrl = `series-img/${encodeURIComponent(cleanSeriesName)}.webp`;

                mainTile.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 15px; text-align: left;">
                        <!-- УВЕЛИЧЕННЫЙ ЛОГОТИП СЕРИИ: подняли высоту до 50px и убрали лишние рамки -->
                        <img src="${seriesLogoUrl}" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';" 
                             style="height: 70px; width: auto; max-width: 90px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));">
                        
                        <!-- Увеличенная альтернативная иконка-заглушка с красивым фоном -->
                        <span style="display: none; font-size: 24px; background: rgba(255,255,255,0.2); width: 70px; height: 70px; border-radius: 10px; align-items: center; justify-content: center; box-shadow: inset 0 1px 3px rgba(255,255,255,0.2);">🏎️</span>
                        
                        <div>
                            <h3 style="margin: 0; font-size: 16px; text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; line-height: 1.2;">${group.name}</h3>
                            <span style="font-size: 10px; opacity: 0.7;">Релиз: ${group.year} г.</span>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span style="font-size: 11px; font-weight: bold; background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 12px; white-space: nowrap;">
                            ${group.ownedCount} из ${group.totalInSeries} шт.
                        </span>
                        <span style="font-size: 14px; font-weight: 900;">${percentDone}%</span>
                        <span style="font-size: 11px; opacity: 0.6;">▼</span>
                    </div>
                `;



// Автономная скрытая сетка для машинок (Растягивается на всю ширину под плитками через grid-column: 1 / -1)
                const carsGrid = document.createElement('div');
                carsGrid.id = gridId;
// ИСПРАВЛЕНО: Сетка машин теперь раздвигает общие колонки и ложится ровно в ряд под плитками
                carsGrid.style.cssText = "display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important; gap: 15px; margin-top: 12px; padding: 15px; background: #f8fafc; border-radius: 8px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); grid-column: 1 / -1 !important; width: 100%; box-sizing: border-box;";

                mainTile.addEventListener('click', function() {
                    const isHidden = carsGrid.style.display === 'none';
// Прячем другие открытые сетки серий, чтобы не захламлять интерфейс
                    document.querySelectorAll('[id^="grid-"]').forEach(el => el.style.display = 'none');
                    carsGrid.style.display = isHidden ? 'grid' : 'none';
                });

                group.items.forEach(car => {
                    const carIsOwned = car.status === 'owned';
                    const cardBorderColor = carIsOwned ? '#10b981' : '#cbd5e1';

                    let yearColor = '#64748b';
                    if (car.year === 2026) yearColor = '#e50012';
                    if (car.year === 2025) yearColor = '#1e40af';
                    if (car.year === 2024) yearColor = '#16a34a';

                    // УМНАЯ ССЫЛКА НА ФОТО: Сначала проверяем встроенную мелкую превьюшку из базы. 
                    // Если её нет, скрипт автоматически генерирует прямую ссылку на качественный .webp файл в твоей папкеcars-img на GitHub Pages!
                    // Если и там файла не окажется, сработает аккуратная серая заглушка.
                    let carImage = car.image || `cars-img/${car.toyNum}.webp` || "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='300' height='150'><rect width='100%' height='100%' fill='%23cbd5e1'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='14' fill='%2364748b'>Нет фото 🏎️</text></svg>";


                    // УМНАЯ СИСТЕМА ПАЛИТРЫ РЕДКОСТИ HOT WHEELS WIKI
                    const carRarity = (car.rarity || '').toLowerCase();
                    const carSeries = (car.seriesName || car.series || '').toLowerCase();

                    // Дефолтные настройки для обычного Mainline (Небесно-голубой)
                    let bottomBarBg = 'rgba(240, 249, 255, 0.95)';
                    let bottomBarBorder = '1px solid #bae6fd';
                    let textColor = '#1e293b';

                    if (carRarity.includes('super treasure') || carRarity.includes('sth')) {
                        // 1. Золотой премиум для Super Treasure Hunt
                        bottomBarBg = 'linear-gradient(135deg, rgba(254,243,199,0.98) 0%, rgba(251,191,36,0.95) 100%)';
                        bottomBarBorder = '1px solid #f59e0b';
                        textColor = '#78350f';
                    } else if (carRarity.includes('treasure hunt') || carRarity.includes('th')) {
                        // 2. Бордово-розовый для обычных Treasure Hunt
                        bottomBarBg = 'rgba(253, 242, 248, 0.95)';
                        bottomBarBorder = '1px solid #fbcfe8';
                        textColor = '#9d174d';
                    } else if (carSeries.includes('silver') || carRarity.includes('silver')) {
                        // 3. Серебряный металлик для Silver Series
                        bottomBarBg = 'linear-gradient(180deg, rgba(248,250,25fc,0.95) 0%, rgba(226,232,240,0.95) 100%)';
                        bottomBarBorder = '1px solid #cbd5e1';
                        textColor = '#334155';
                    } else if (carSeries.includes('culture') || carSeries.includes('boulevard') || carSeries.includes('premium')) {
                        // 4. Матовый графит для Pop Culture, Car Culture и Boulevard
                        bottomBarBg = 'rgba(30, 41, 59, 0.95)';
                        bottomBarBorder = '1px solid #475569';
                        textColor = '#f8fafc'; // Белый текст для темного фона
                    }

//Позиционирование блистера HW в карточке
                    const card = document.createElement('div');
                    card.style.cssText = `
                        position: relative;
                        width: 100%;
                        height: 160px;
                        border: 2px solid ${cardBorderColor};
                        border-radius: 12px;
                        overflow: hidden;
                        background-image: url('${carImage}');
                        background-size: 160% auto;
                        background-position: center 55%;
                        background-color: #cbd5e1;
                        box-shadow: 0 4px 10px rgba(0,0,0,0.04);
                        display: flex;
                        flex-direction: column;
                        justify-content: space-between;
                        box-sizing: border-box;
                        ${!carIsOwned ? 'filter: grayscale(0.5); opacity: 0.9;' : ''}
                    `;


                    card.innerHTML = `                   
<!-- ВЕРХНИЙ БЛОК: Чистый год и номер коллекции без дублирования цвета плашки -->
                        <div style="display: flex; flex-direction: column; align-items: flex-end; padding: 8px; gap: 4px; pointer-events: none;">
                            <div style="background: ${carIsOwned ? yearColor : '#cbd5e1'}; color: white; padding: 2px 10px; font-weight: bold; font-size: 11px; border-radius: 6px;">
                                ${car.year || '—'}
                            </div>
                            <div style="background: rgba(255, 255, 255, 0.85); color: #1e293b; padding: 2px 8px; font-weight: 800; font-size: 11px; border-radius: 6px; border: 1px solid #cbd5e1;">
                                ${car.seriesNum || car.carNum || 1}/${car.seriesTotal || car.carTotal || 1}
                            </div>
                        </div>



                        <button onclick="event.stopPropagation(); resetCarStatus(${car.id});" style="position: absolute; top: 8px; left: 8px; background: rgba(255,51,55,0.8); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20;">×</button>
 <!-- ИСПРАВЛЕНО: Плашка теперь использует динамические цвета редкости -->
                        <div style="background: ${bottomBarBg}; border-top: ${bottomBarBorder}; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;">

                            <div style="display: flex; flex-direction: column; max-width: 65%; text-align: left;">
                                <span style="font-size: 13px; font-weight: bold; color: ${textColor}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase;">${car.name}</span>

                                ${car.toyNum ? `<span style="color: #ff5000; font-size: 10px; font-weight: bold; margin-top: 1px;">[${car.toyNum}]</span>` : ''}
                            </div>
                            
                            <div style="display: flex; align-items: center;">
                                ${carIsOwned ? `
                                    <div style="font-size: 12px; font-weight: 900; color: #1e293b; background: rgba(16,185,129,0.15); padding: 5px 10px; border-radius: 6px; white-space: nowrap;">
                                        💰 ${car.price} ₽
                                    </div>
                                ` : `
<!-- ИСПРАВЛЕНО: Интерактивная кнопка покупки по клику прямо в альбоме -->
                                    <button type="button" onclick="event.stopPropagation(); buyCarInline(${car.id});" style="font-size: 12px; font-weight: 900; color: #1e293b; background: #cbd5e1; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: background 0.1s;">
                                        Купить
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                    carsGrid.appendChild(card);
                });

                tileWrapper.appendChild(mainTile);
                tileWrapper.appendChild(carsGrid);
                collectionGrid.appendChild(tileWrapper);
            });
// ИСПРАВЛЕНО: Если до обновления была открыта группа, возвращаем ей режим отображения 'grid'
            if (activeGridId) {
                const restoreGrid = document.getElementById(activeGridId);
                if (restoreGrid) restoreGrid.style.display = 'grid';
            }
        }

// ФУНКЦИЯ БЫСТРОЙ ПОКУПКИ МОДЕЛИ ВНУТРИ АЛЬБОМА
        function buyCarInline(carId) {
            const car = cars.find(c => c.id === carId);
            if (!car) return;

            const userPrice = prompt(`Поздравляем с покупкой модели ${car.name}! Укажите цену приобретения (₽):`, "250");
            
// Если пользователь отменил диалоговое окно, прерываем функцию
            if (userPrice === null) return;

// Переводим машинку в статус купленной и сохраняем цену
            car.status = 'owned';
            car.price = parseFloat(userPrice) || 0;

// Пересохраняем базу данных в localStorage и обновляем витрину
            saveToStorage();
        }
                // ФУНКЦИЯ СБРОСА СТАТУСА МОДЕЛИ (Переводит обратно в поиск)
        function resetCarStatus(carId) {
            const car = cars.find(c => c.id === carId);
            if (!car) return;

            if (confirm(`Вы действительно хотите перевести модель ${car.name} обратно в статус 'В поиске'?`)) {
                car.status = 'missing';
                car.price = 0;
                saveToStorage(); // Пересохраняем локальные изменения и обновляем дашборд
            }
        }


        if (searchInput) searchInput.addEventListener('input', updateDashboard);
        if (filterSelect) filterSelect.addEventListener('change', updateDashboard);

// Вместо простой отрисовки запускаем сетевое чтение файла базы данных
        loadDatabase();
    </script>
